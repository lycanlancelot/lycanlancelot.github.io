<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Dashboard — Lance Song</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root {
  --bg:       #070b12;
  --panel:    #101826;
  --panel-2:  #132033;
  --panel-3:  #1a2d45;
  --line:     rgba(148,163,184,0.18);
  --text:     #e5edf8;
  --muted:    #9fb0c7;
  --dim:      #74849b;
  --accent:   #3dd6b4;
  --accent-2: #61a5ff;
  --warn:     #f5c15c;
  --red:      #f87171;
  --purple:   #a78bfa;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:Monaco,"Bitstream Vera Sans Mono","Lucida Console",Terminal,monospace;font-size:13px;line-height:1.5;}
a{color:var(--accent-2);text-decoration:none;}
a:hover{text-decoration:underline;}

/* NAV */
.site-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:100;
}
.site-nav .brand{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:1px;}
.site-nav .back-link{color:var(--muted);font-size:12px;}
.site-nav .back-link:hover{color:var(--text);}

/* HERO */
.dash-hero{
  padding:48px 32px 32px;max-width:960px;margin:0 auto;
}
.dash-hero h1{font-size:28px;color:var(--text);letter-spacing:-0.5px;margin-bottom:10px;}
.dash-hero h1 span{color:var(--accent);}
.dash-hero p{color:var(--muted);max-width:560px;font-size:12px;line-height:1.7;}

/* STATS */
.stat-row{
  display:flex;gap:24px;margin-top:24px;flex-wrap:wrap;
}
.stat-pill{
  background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:10px 18px;font-size:11px;
  display:flex;flex-direction:column;gap:2px;
}
.stat-pill strong{color:var(--accent);font-size:18px;}
.stat-pill span{color:var(--dim);}

/* FILTERS */
.filter-bar{
  max-width:960px;margin:0 auto;padding:0 32px 20px;
  display:flex;gap:8px;flex-wrap:wrap;
}
.filter-btn{
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:6px 14px;border-radius:4px;cursor:pointer;font-size:11px;
  font-family:inherit;transition:all 0.15s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--text);}
.filter-btn.active{background:var(--accent);color:#070b12;border-color:var(--accent);font-weight:700;}

/* GRID */
.projects-grid{
  max-width:960px;margin:0 auto;padding:0 32px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;
}

/* CARD */
.project-card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:20px;cursor:pointer;transition:all 0.2s;position:relative;
  display:flex;flex-direction:column;gap:10px;
}
.project-card:hover{border-color:var(--accent-2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.project-card.highlight{border-color:rgba(61,214,180,0.35);}

.card-kicker{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
.card-title{font-size:16px;color:var(--text);font-weight:700;}
.card-tagline{font-size:11px;color:var(--muted);line-height:1.5;}
.card-tech{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.tech-pill{
  font-size:9px;padding:2px 7px;border-radius:3px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.status-badge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:0.5px;}
.status-active{background:rgba(61,214,180,0.12);color:var(--accent);border:1px solid rgba(61,214,180,0.3);}
.status-2025{background:rgba(97,165,255,0.12);color:var(--accent-2);border:1px solid rgba(97,165,255,0.3);}
.status-2026{background:rgba(167,139,250,0.12);color:var(--purple);border:1px solid rgba(167,139,250,0.3);}
.status-contrib{background:rgba(245,193,92,0.12);color:var(--warn);border:1px solid rgba(245,193,92,0.3);}
.card-open-hint{font-size:10px;color:var(--dim);}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,8,16,0.85);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:24px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:100%;max-width:820px;max-height:90vh;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,0.6);
}
.modal-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:22px 24px 16px;border-bottom:1px solid var(--line);gap:16px;
}
.modal-header-info{display:flex;flex-direction:column;gap:6px;}
.modal-title{font-size:20px;color:var(--text);font-weight:700;}
.modal-tagline{font-size:12px;color:var(--muted);}
.modal-links{display:flex;gap:8px;align-items:center;}
.modal-link-btn{
  font-size:10px;padding:4px 12px;border-radius:4px;border:1px solid var(--line);
  color:var(--muted);background:var(--panel-2);cursor:pointer;font-family:inherit;
  text-decoration:none;display:inline-flex;align-items:center;gap:4px;
}
.modal-link-btn:hover{border-color:var(--accent-2);color:var(--accent-2);}
.modal-link-btn.primary{background:var(--accent);color:#070b12;border-color:var(--accent);font-weight:700;}
.modal-link-btn.primary:hover{background:#2fc49f;}
.modal-close{
  background:none;border:1px solid var(--line);border-radius:6px;
  color:var(--dim);font-size:16px;width:30px;height:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:inherit;
}
.modal-close:hover{color:var(--text);border-color:var(--muted);}

/* TABS */
.modal-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--line);
  padding:0 24px;background:var(--panel);
}
.modal-tab{
  padding:11px 16px;font-size:11px;color:var(--dim);cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;
  transition:all 0.15s;margin-bottom:-1px;
}
.modal-tab:hover{color:var(--muted);}
.modal-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* MODAL BODY */
.modal-body{flex:1;overflow-y:auto;padding:24px;}

/* OVERVIEW TAB */
.overview-description{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:18px;}
.feature-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.feature-list li{
  font-size:11px;color:var(--muted);padding-left:16px;position:relative;line-height:1.5;
}
.feature-list li::before{content:"▸";position:absolute;left:0;color:var(--accent);}
.tech-section h4{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.tech-grid{display:flex;flex-wrap:wrap;gap:5px;}
.tech-tag{
  font-size:10px;padding:3px 10px;border-radius:4px;
  background:var(--panel-3);border:1px solid var(--line);color:var(--text);
}

/* ARCHITECTURE TAB */
.arch-wrap{min-height:240px;padding:8px 0;}
.mermaid{font-size:11px !important;}

/* GRAPH TAB */
.graph-wrap{width:100%;height:380px;position:relative;}
.graph-wrap svg{width:100%;height:100%;}
.graph-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* SECTION LABEL */
.section-label{
  max-width:960px;margin:32px auto 12px;padding:0 32px;
  font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

/* LECTURES TAB */
.lec-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.lec-legend{display:flex;flex-wrap:wrap;gap:5px;}
.lec-list{display:flex;flex-direction:column;gap:8px;}
.lec-row{
  display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;
  transition:border-color 0.15s;
}
.lec-row:hover{border-color:rgba(148,163,184,0.35);}
.lec-date{font-size:10px;color:var(--dim);padding-top:2px;font-variant-numeric:tabular-nums;}
.lec-body{display:flex;flex-direction:column;gap:6px;}
.lec-title{font-size:12px;color:var(--text);line-height:1.4;}
.lec-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.lec-topic-pill{
  font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid;font-weight:700;letter-spacing:0.5px;
}
.lec-duration{font-size:10px;color:var(--dim);}

/* HIDDEN */
.hidden{display:none !important;}

@media(max-width:600px){
  .dash-hero{padding:32px 16px 24px;}
  .filter-bar,.projects-grid,.section-label{padding-left:16px;padding-right:16px;}
  .modal{max-height:95vh;}
  .modal-header{flex-direction:column;}
}
</style>
</head>

// ─── RENDER STATS ─────────────────────────────────────────────────────────────
function renderStats() {
  const total = PROJECTS.length;
  const active = PROJECTS.filter(p => p.status === "active").length;
  const techs = new Set(PROJECTS.flatMap(p => p.tech)).size;
  const cats = new Set(PROJECTS.map(p => p.category)).size;

  const data = [
    { value: total,  label: "Total Projects" },
    { value: active, label: "Active Now" },
    { value: techs,  label: "Technologies" },
    { value: cats,   label: "Categories" }
  ];

  document.getElementById("stat-row").innerHTML = data
    .map(d => `<div class="stat-pill"><strong>${d.value}</strong><span>${d.label}</span></div>`)
    .join("");
}

// ─── RENDER FILTERS ───────────────────────────────────────────────────────────
let currentFilter = "all";

function renderFilters() {
  document.getElementById("filter-bar").innerHTML = CATEGORIES
    .map(c => `<button class="filter-btn${c.id === currentFilter ? " active" : ""}"
                 data-filter="${c.id}">${c.label}
                 <span style="margin-left:4px;opacity:0.6">
                   ${c.id === "all" ? PROJECTS.length : PROJECTS.filter(p => p.category === c.id).length}
                 </span></button>`)
    .join("");

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      renderFilters();
      renderGrid();
    });
  });
}

// ─── RENDER GRID ─────────────────────────────────────────────────────────────
function statusBadge(p) {
  const cls = p.status === "active" ? "status-active"
            : p.status === "2025"   ? "status-2025"
            : p.status === "2026"   ? "status-2026"
            : "status-contrib";
  const label = p.status === "active" ? "● ACTIVE" : p.year;
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function renderGrid() {
  const filtered = currentFilter === "all"
    ? PROJECTS
    : PROJECTS.filter(p => p.category === currentFilter);

  const grouped = {};
  CATEGORIES.slice(1).forEach(c => {
    const items = filtered.filter(p => p.category === c.id);
    if (items.length) grouped[c.id] = { label: c.label, items };
  });

  const container = document.getElementById("projects-container");

  if (currentFilter !== "all") {
    container.innerHTML = `
      <div class="projects-grid">
        ${filtered.map(cardHTML).join("")}
      </div>`;
  } else {
    container.innerHTML = Object.entries(grouped).map(([id, { label, items }]) => `
      <div class="section-label">${label}</div>
      <div class="projects-grid">
        ${items.map(cardHTML).join("")}
      </div>`).join("");
  }

  container.querySelectorAll(".project-card").forEach(card => {
    card.addEventListener("click", () => openModal(card.dataset.id));
  });
}

function cardHTML(p) {
  return `<article class="project-card${p.highlight ? " highlight" : ""}" data-id="${p.id}">
    <div class="card-kicker">${p.kicker}</div>
    <div class="card-title">${p.name}</div>
    <div class="card-tagline">${p.tagline}</div>
    <div class="card-tech">${p.tech.slice(0, 4).map(t => `<span class="tech-pill">${t}</span>`).join("")}${p.tech.length > 4 ? `<span class="tech-pill">+${p.tech.length - 4}</span>` : ""}</div>
    <div class="card-footer">
      ${statusBadge(p)}
      <span class="card-open-hint">↗ details</span>
    </div>
  </article>`;
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
let currentProject = null;
let currentTab = "overview";
let mermaidRendered = new Set();

function openModal(id) {
  currentProject = PROJECTS.find(p => p.id === id);
  currentTab = "overview";
  mermaidRendered.clear();
  renderModalHeader();
  renderModalTabs();
  renderTabContent("overview");
  document.getElementById("modal-overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  document.body.style.overflow = "";
}

function renderModalHeader() {
  const p = currentProject;
  document.getElementById("modal-title").textContent = p.name;
  document.getElementById("modal-tagline").textContent = p.tagline;

  const links = [statusBadge(p)];
  if (p.github)  links.push(`<a class="modal-link-btn primary" href="${p.github}"  target="_blank">↗ GitHub</a>`);
  if (p.github2) links.push(`<a class="modal-link-btn"         href="${p.github2}" target="_blank">↗ GitHub 2</a>`);
  if (p.demo)    links.push(`<a class="modal-link-btn"         href="${p.demo}"    target="_blank">↗ Demo</a>`);
  document.getElementById("modal-links").innerHTML = links.join("");
}

function tabsForProject(p) {
  if (p.type === "teaching") {
    return [
      { id: "overview",     label: "Overview" },
      { id: "architecture", label: "Curriculum Map" },
      { id: "lectures",     label: "Lectures" },
    ];
  }
  return [
    { id: "overview",     label: "Overview" },
    { id: "architecture", label: "Architecture" },
    { id: "codegraph",    label: "Code Graph" },
  ];
}

function renderModalTabs() {
  const tabs = tabsForProject(currentProject);
  document.getElementById("modal-tabs").innerHTML = tabs
    .map(t => `<button class="modal-tab${t.id === currentTab ? " active" : ""}" data-tab="${t.id}">${t.label}</button>`)
    .join("");
  document.querySelectorAll(".modal-tab").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
}

function switchTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll(".modal-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
  renderTabContent(tabId);
}

  const p = currentProject;
  const body = document.getElementById("modal-body");

  if (tabId === "overview") {
    body.innerHTML = `
      <p class="overview-description">${p.description}</p>
      <ul class="feature-list">${p.features.map(f => `<li>${f}</li>`).join("")}</ul>
      <div class="tech-section">
        <h4>Tech Stack</h4>
        <div class="tech-grid">${p.tech.map(t => `<span class="tech-tag">${t}</span>`).join("")}</div>
      </div>`;
  }

  else if (tabId === "architecture") {
    const mId = "mermaid-" + p.id;
    if (!mermaidRendered.has(mId)) {
      body.innerHTML = `<div class="arch-wrap"><div class="mermaid" id="${mId}">${p.mermaid}</div></div>`;
      mermaid.run({ nodes: [document.getElementById(mId)] });
      mermaidRendered.add(mId);
    } else {
      body.innerHTML = `<div class="arch-wrap"><div class="mermaid" id="${mId}">${p.mermaid}</div></div>`;
    }
  }

  else if (tabId === "codegraph") {
    body.innerHTML = `
      <div class="graph-wrap" id="graph-wrap-${p.id}"></div>
      <div class="graph-legend">${
        Object.entries(NODE_COLORS).map(([type, color]) =>
          `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${type}</div>`
        ).join("")
      }</div>`;
    setTimeout(() => renderD3Graph(p, `graph-wrap-${p.id}`), 50);
  }

  else if (tabId === "lectures") {
    const legend = Object.entries(TOPIC_COLORS).map(([k, v]) =>
      `<span class="lec-topic-pill" style="background:${v.bg};border-color:${v.border};color:${v.text}">${v.label}</span>`
    ).join("");

    const rows = (p.lectures || []).map(l => {
      const tc = TOPIC_COLORS[l.topic] || TOPIC_COLORS.applied;
      return `<div class="lec-row">
        <div class="lec-date">${l.date}</div>
        <div class="lec-body">
          <div class="lec-title">${l.title}</div>
          <div class="lec-meta">
            <span class="lec-topic-pill" style="background:${tc.bg};border-color:${tc.border};color:${tc.text}">${tc.label}</span>
            <span class="lec-duration">${l.duration}</span>
          </div>
        </div>
      </div>`;
    }).join("");

    body.innerHTML = `
      <div class="lec-header">
        <span style="color:var(--muted);font-size:11px">${p.lectures.length} sessions · Feb – May 2026</span>
        <div class="lec-legend">${legend}</div>
      </div>
      <div class="lec-list">${rows}</div>`;
  }
}

// ─── D3 CODE GRAPH ────────────────────────────────────────────────────────────
function renderD3Graph(project, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const W = container.clientWidth || 760;
  const H = 380;

  d3.select(container).select("svg").remove();

  const nodes = project.graph.nodes.map(n => ({ ...n }));
  const links = project.graph.links.map(l => ({ source: l.s, target: l.t }));

  const svg = d3.select(container).append("svg")
    .attr("width", W).attr("height", H)
    .style("background", "var(--panel-2)")
    .style("border-radius", "8px");

  // Arrow marker
  svg.append("defs").append("marker")
    .attr("id", "arrow")
    .attr("viewBox", "0 -4 8 8")
    .attr("refX", 16).attr("refY", 0)
    .attr("markerWidth", 6).attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-4L8,0L0,4")
    .attr("fill", "rgba(148,163,184,0.4)");

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(90).strength(0.6))
    .force("charge", d3.forceManyBody().strength(-280))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collision", d3.forceCollide(36));

  const link = svg.append("g").selectAll("line")
    .data(links).join("line")
    .attr("stroke", "rgba(148,163,184,0.25)")
    .attr("stroke-width", 1.5)
    .attr("marker-end", "url(#arrow)");

  const node = svg.append("g").selectAll("g")
    .data(nodes).join("g")
    .attr("cursor", "pointer")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append("circle")
    .attr("r", 14)
    .attr("fill", d => NODE_COLORS[d.type] || NODE_COLORS.config)
    .attr("fill-opacity", 0.2)
    .attr("stroke", d => NODE_COLORS[d.type] || NODE_COLORS.config)
    .attr("stroke-width", 2);

  node.append("text")
    .attr("text-anchor", "middle")
    .attr("dy", "0.32em")
    .attr("font-size", "9px")
    .attr("fill", d => NODE_COLORS[d.type] || NODE_COLORS.config)
    .attr("font-family", "Monaco, monospace")
    .text(d => d.label.length > 14 ? d.label.slice(0, 13) + "…" : d.label);

  // Tooltip label below
  node.append("title").text(d => d.label);

  sim.on("tick", () => {
    link
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${Math.max(16, Math.min(W - 16, d.x))},${Math.max(16, Math.min(H - 16, d.y))})`);
  });
}
