  description: >-
    Led search and recommendation enhancements on a global e-commerce marketplace, built on Marqo
    vector search and GCP Vertex AI MLOps pipelines. The hard part was not the model — it was making
    semantic retrieval pay off on a large, noisy, long-tail catalogue without regressing the head
    queries that carry the revenue. I owned this end to end: offline evaluation, experiment design,
    deployment coordination, and post-launch metric review, communicating results and model logic to
    product stakeholders throughout.
  features:
    - Marqo vector retrieval for semantic coverage of long-tail queries
