# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for project content.
#
# Consumed by:
#   • projects.html  — inlined as JSON via {{ site.data.projects | jsonify }}
#   • index.html     — Featured / Data Science / Enablement sections via Liquid
#
# RULES — read before editing:
#
# 1. This file MUST stay a top-level SEQUENCE (a list of `- id: ...` entries).
#    If it is ever split into a `_data/projects/` DIRECTORY, Jekyll turns
#    `site.data.projects` into a hash keyed by filename and `PROJECTS.length` /
#    `.filter(...)` break at runtime with NO build error.
#
# 2. NEVER write the literal sequence `</script` in any value. `jsonify` does
#    not escape `<`, so it would terminate the JSON script tag early and break
#    the dashboard. `script/validate-projects.py` enforces this.
#
# 3. Liquid is NEVER run over data-file values, so mermaid's `{{Node}}` syntax
#    is safe HERE and only here. That is the whole reason this file exists.
#    Keep `<br/>` and `&amp;` exactly as written — mermaid renders them.
#
# 4. `featured: true` REQUIRES `featured_order` (Liquid's `sort` needs the key
#    present on every filtered item). Lower number = higher on the homepage.
#
# 5. Tabs in the project modal are PRESENCE-DRIVEN. A tab appears iff its field
#    exists: mermaid→Architecture, graph→Code Graph, experiment→Experiment
#    Design, metrics→Impact & Metrics, delivery→Delivery, lectures→Sessions.
#    Omit a field entirely rather than setting it to null.
#
# 6. `source_refs` are bullet ids in data/experience-bank.json. They are not
#    rendered — they exist so every claim here can be traced to verified copy.
#
# Run `python3 script/validate-projects.py` after editing.
# ─────────────────────────────────────────────────────────────────────────────

