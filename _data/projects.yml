    - Vertex AI MLOps pipelines for repeatable training, deployment and monitoring
    - Long-tail relevance tuning explicitly balanced against measurable business impact
    - Owned the full lifecycle — offline eval, experiment design, rollout, post-launch review
  experiment:
    hypothesis: Semantic (vector) retrieval improves relevance on long-tail queries without regressing head-query conversion.
    design: Offline relevance evaluation on held-out sessions first, then an online A/B test on production traffic with a staged rollout.
    guardrails: ["Head-query conversion", "Latency budget", "Catalogue coverage", "Result diversity"]
    readouts: ["CTR", "Add-to-cart rate", "Long-tail query relevance"]
